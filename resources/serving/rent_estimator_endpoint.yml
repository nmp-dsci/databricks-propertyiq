# PARKED — Free Edition caps custom model-serving endpoints at two, and both
# slots currently hold agents: qa_agent (scripts/register_agent.py) and
# rag_transcript_agent (scripts/register_rag_agent.py), each via agents.deploy.
#
# Deploying this as a third endpoint fails the whole bundle with "You've hit
# the limit for endpoints for free usage", which also blocks every unrelated
# resource in the same deploy — so the block below is commented out rather than
# left to fail.
#
# To bring the rent estimator back, free one slot by deleting either agent
# endpoint (the QA agent is the cheaper one to lose — the benchmark can still
# run its graph locally):
#   1. databricks serving-endpoints delete agents_workspace-propertyiq_ml-qa_agent
#   2. uncomment the block below
#   3. make deploy
# Nothing else is lost in the meantime: the model itself is still registered at
# {catalog}.{ml_schema}.rent_estimator with its champion alias, batch scoring
# (ml_score) still runs, and only the real-time endpoint and the ai_query
# example in src/sql/03_ml_ai_query.sql depend on this.
#
# ---------------------------------------------------------------------------
# The real-time half of R5: the champion rent estimator behind a serverless
# CPU serving endpoint (the only serving flavour on Free Edition).
#
# The endpoint pins a concrete model *version* — serving config cannot follow
# a UC alias by itself. The promotion gate closes that gap: when ml_train
# promotes a challenger, the training notebook updates this endpoint's config
# to the new champion version in the same breath as the alias flip. Losing
# challengers never touch it.
#
# scale_to_zero: a weekly-data demo endpoint should cost nothing between
# queries; first request after idle pays a cold start, which is the trade-off
# to say out loud.
#
# resources:
#   model_serving_endpoints:
#     rent_estimator_endpoint:
#       name: propertyiq-rent-estimator
#       config:
#         served_entities:
#           - name: rent-estimator
#             entity_name: ${var.catalog}.${var.ml_schema}.rent_estimator
#             entity_version: "1"
#             workload_size: Small
#             scale_to_zero_enabled: true
