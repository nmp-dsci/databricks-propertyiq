resources:
  jobs:
    medallion:
      name: propertyiq-medallion
      # Free Edition allows 5 concurrent job tasks; this job runs 4 in sequence.
      max_concurrent_runs: 1

      # No `job_clusters:` block anywhere — omitting compute means serverless,
      # which is the only option on Free Edition.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../src/notebooks/01_bronze_ingest.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../src/notebooks/02_silver_clean.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/notebooks/03_gold_aggregate.py

        # Last on purpose: a failed check fails the run, so bad numbers stop
        # here instead of reaching the dashboard.
        - task_key: checks
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../../src/notebooks/04_checks.py

      queue:
        enabled: true
