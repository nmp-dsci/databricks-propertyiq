resources:
  jobs:
    medallion:
      name: propertyiq-medallion
      # Free Edition allows 5 concurrent job tasks; this job runs 4 in sequence.
      max_concurrent_runs: 1

      # No `job_clusters:` block anywhere — omitting compute means serverless,
      # which is the only option on Free Edition.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../src/notebooks/01_bronze_ingest.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../src/notebooks/02_silver_clean.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/notebooks/03_gold_aggregate.py

        # Last on purpose: a failed check fails the run, so bad numbers stop
        # here instead of reaching the dashboard.
        - task_key: checks
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../../src/notebooks/04_checks.py

      # Run when propertyiq_getdata lands a file, rather than on a clock. A
      # schedule would fire on the many days with no new data, and would also
      # sit idle for hours after a publish that did happen.
      #
      # `url` must be a directory. Auto Loader below reads landing/sales and
      # landing/lodgements separately, but the trigger watches their shared
      # parent so one trigger covers both feeds.
      #
      # wait_after_last_change_seconds debounces a multi-file publish: getdata
      # uploads hundreds of partitions on a bootstrap, and without it every
      # file would be a candidate to start a run. 60s of quiet means "the
      # publish has finished", and min_time_between_triggers_seconds then caps
      # us at one run per 5 minutes whatever happens upstream.
      #
      # `mode: development` would normally pause this, the same way it pauses
      # schedules, so that a deploy from a laptop never starts running things.
      # The explicit UNPAUSED overrides that, because here the dev target *is*
      # the working environment — there is only one workspace. Drop that line
      # if a second target ever appears, or a local deploy will arm a trigger
      # against shared data. `make run` still works for an on-demand run.
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/${var.volume}/landing/
          wait_after_last_change_seconds: 60
          min_time_between_triggers_seconds: 300

      queue:
        enabled: true
