name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on every push, no workspace credentials needed. This is the part that
  # keeps the repo honest for anyone reading it cold.
  local:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -q

  # Only runs when workspace secrets are configured. Validates the bundle
  # definition (job graph, dashboard JSON, variable references) without
  # deploying anything.
  bundle:
    name: validate bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate
        continue-on-error: true
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::notice::No DATABRICKS_HOST secret set — skipping bundle validation."
            exit 0
          fi
          databricks bundle validate -t dev
