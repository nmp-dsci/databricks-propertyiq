bundle:
  name: databricks-propertyiq

variables:
  catalog:
    description: Unity Catalog catalog. Free Edition ships with `workspace`.
    default: workspace
  schema:
    description: Schema holding bronze/silver/gold tables and the landing volume.
    default: propertyiq
  volume:
    description: >-
      UC volume (inside the schema) holding the landed source files —
      the updates-only Parquet feed published under landing/sales/ and
      landing/lodgements/ by the sibling propertyiq_getdata project.
    default: propertyiq
  pipeline_schema:
    description: >-
      Schema for the Lakeflow Declarative Pipeline variant in
      resources/pipelines/. Deliberately separate from `schema` so the pipeline
      can never write over the tables the medallion job owns — it is a
      side-by-side comparison, not a replacement.
    default: propertyiq_dp
  ml_schema:
    description: >-
      Schema for the ML loop (feature table, model, predictions, drift
      metrics). Separate from `schema` for the same reason as
      pipeline_schema: the ML jobs can never write over the marts the
      medallion job owns.
    default: propertyiq_ml
  rent_estimator_endpoint:
    description: >-
      Serving endpoint name for the rent estimator. Currently PARKED — Free
      Edition allows one custom serving endpoint and rag_transcript_agent holds
      it (see resources/serving/rent_estimator_endpoint.yml). In dev the
      deployed endpoint carried a `dev_<user>_` prefix; this default matches the
      un-prefixed production name.
    default: propertyiq-rent-estimator
  rag_schema:
    description: >-
      Schema for the transcript-lab RAG port (branch `rag`): bronze/silver
      tables exported from the sibling transcript-rag-agent project, plus the
      Vector Search indexes and the QA agent built on them. Separate from
      `schema` for the same reason as pipeline_schema and ml_schema — a
      different corpus with a different owner.
    default: rag
  rag_volume:
    description: >-
      UC volume (inside rag_schema) holding the landed transcript-lab
      snapshots, one directory per entity, published by scripts/rag_export.py.
    default: landing
  warehouse_id:
    description: >-
      Serverless SQL warehouse id, used by dashboards and SQL tasks.
      Find it with `databricks warehouses list`, or under
      SQL Warehouses > (your warehouse) > Connection details.
      Override per-deploy with --var="warehouse_id=..." for a different workspace.
    default: 7f9b6eb116a15acc

include:
  - resources/jobs/*.yml
  - resources/dashboards/*.yml
  - resources/pipelines/*.yml
  - resources/serving/*.yml

targets:
  # Default target. Deploys under /Workspace/Users/<you>/.bundle/... so nothing
  # collides with hand-made notebooks. Jobs are paused; run them by hand.
  # No `host:` here on purpose. The host comes from the CLI profile
  # (`--profile`, which the Makefile always passes), so the same file works
  # against any workspace without an edit. Naming a host here would also have
  # to be a literal URL — `${workspace.host}` is a reference to the field being
  # defined, so it never resolves and the bundle fails to validate.
  dev:
    mode: development
    default: true

  # Same workspace, but deployed as a "real" release: unprefixed names,
  # schedules live. Useful for the Interview 4 demo build.
  demo:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
    resources:
      jobs:
        medallion:
          # dev is the working environment and owns the armed file-arrival
          # trigger on landing/. `mode: production` does not auto-pause
          # triggers, so without this override a demo deploy would arm a
          # second trigger on the same volume path, racing dev's run against
          # the same bronze/silver/gold tables on a single upstream publish.
          trigger:
            pause_status: PAUSED
        ml_score:
          # Same reasoning as medallion above: dev owns the armed table-update
          # trigger on gold_property_rent; a demo deploy must not arm a second
          # one that double-scores every mart rebuild.
          trigger:
            pause_status: PAUSED
        rag_ingest:
          # And again for the RAG landing volume: dev owns that file-arrival
          # trigger, so a demo deploy must not race a second run against the
          # same silver MERGE targets on one `make rag-export`.
          trigger:
            pause_status: PAUSED
      pipelines:
        medallion_pipeline:
          # The pipeline yml sets development: true for fast dev iteration;
          # production mode refuses that combination, so the demo release
          # flips it here rather than forking the resource file.
          development: false
